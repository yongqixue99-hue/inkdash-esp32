[platformio]
default_envs = esp32c3-ink-dashboard

[env:esp32c3-ink-dashboard]
platform = espressif32@6.7.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = partitions_4mb.csv

monitor_speed = 115200
upload_speed = 921600

lib_deps =
    zinggjm/GxEPD2@1.6.5
    bblanchon/ArduinoJson@7.4.2
    tzapu/WiFiManager@2.0.17

build_flags =
    -D CORE_DEBUG_LEVEL=1
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

[env:esp32c3-ink-dashboard-release]
extends = env:esp32c3-ink-dashboard
build_flags =
    ${env:esp32c3-ink-dashboard.build_flags}
    -D INKDASH_FIRMWARE_VERSION_CODE=${sysenv.INKDASH_RELEASE_VERSION_CODE}
    -D INKDASH_FIRMWARE_VERSION=\"${sysenv.INKDASH_RELEASE_VERSION}\"

[env:esp32c3-ink-dashboard-rollback-probe]
extends = env:esp32c3-ink-dashboard-release
build_flags =
    ${env:esp32c3-ink-dashboard-release.build_flags}
    -D INKDASH_OTA_ROLLBACK_PROBE=1

[env:esp32c3-ink-dashboard-cache-probe]
extends = env:esp32c3-ink-dashboard-release
build_flags =
    ${env:esp32c3-ink-dashboard-release.build_flags}
    -D INKDASH_WALLPAPER_ENDPOINT=\"http://192.0.2.1/wallpaper-cache-probe-missing.bin\"
